[tools]
rumdl = "0.2.62"
swiftformat = "0.62.1"
swiftlint = "0.65.1"

[tasks.format]
description = "Format Swift sources"
run = "swiftformat ."

[tasks."format-check"]
description = "Check Swift formatting"
run = "swiftformat --lint ."

[tasks.lint]
description = "Lint Swift sources"
run = "swiftlint"

[tasks."markdown-lint"]
description = "Lint Markdown files"
run = "rumdl check ."

[tasks.test]
description = "Run the test suite"
run = "swift test"

[tasks.wift]
description = "Run a Swift script with wift"
run = "swift run wift"

[tasks."support-size"]
description = "Report built-in library and compiler cache context sizes"
run = "sh Scripts/support-size.sh"

[tasks.benchmark]
description = "Run end-to-end performance benchmarks"
run = "sh Scripts/benchmark.sh"

[tasks.install]
description = "Install wift to ~/.local/bin"
run = """
swift build -c release
install -d "$HOME/.local/bin"
install -m 755 "$(swift build -c release --show-bin-path)/wift" "$HOME/.local/bin/wift"
"""

[tasks.uninstall]
description = "Remove wift from ~/.local/bin"
run = "rm -f \"$HOME/.local/bin/wift\""

[tasks.check]
description = "Run all project checks"
depends = ["format-check", "lint", "markdown-lint", "test"]
