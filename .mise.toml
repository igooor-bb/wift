[tools]
swiftformat = "0.62.1"
swiftlint = "0.65.1"

[tasks.format]
description = "Format Swift sources"
run = "swiftformat ."

[tasks."format-check"]
description = "Check Swift formatting"
run = "swiftformat --lint ."

[tasks.lint]
description = "Lint Swift sources"
run = "swiftlint"

[tasks.test]
description = "Run the test suite"
run = "swift test"

[tasks.wift]
description = "Run a Swift script with wift"
run = "swift run wift"

[tasks.check]
description = "Run all project checks"
depends = ["format-check", "lint", "test"]
